<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo · Phố Tài Chính</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
  :root { --bg:#0b0a14; --panel:#1d1a2e; --line:#3a3358; --txt:#e8e4f5; --mut:#8f88b0; --acc:#f5c542; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--txt); font:18px/1.2 'VT323', monospace; }
  #wrap { display:flex; flex-direction:column; height:100%; }
  #bar { display:flex; gap:12px; align-items:center; padding:8px 12px; background:var(--panel); border-bottom:3px solid #07060d; flex-wrap:wrap; }
  #bar b { color:var(--acc); font-weight:400; font-size:22px; letter-spacing:1px; }
  #bar label { color:var(--mut); display:flex; gap:6px; align-items:center; }
  select, button { font:inherit; color:var(--txt); background:#2c2646; border:2px solid var(--line); padding:2px 10px; border-radius:0; cursor:pointer; }
  button:hover { border-color:var(--acc); } button.p { border-color:var(--acc); color:var(--acc); }
  #stage { flex:1; min-height:0; display:grid; place-items:center; position:relative; }
  canvas { image-rendering: pixelated; width:min(100%, calc((100vh - 96px) * 16 / 9)); aspect-ratio:16/9; background:#000; border:3px solid #07060d; cursor:default; }
  #hint { padding:6px 12px; color:var(--mut); }
  #tip { position:fixed; pointer-events:none; background:#0b0a14ee; border:2px solid var(--acc); padding:3px 8px; font-size:17px; display:none; z-index:5; white-space:nowrap; }
  #toast { position:fixed; left:50%; bottom:70px; transform:translateX(-50%); background:#0b0a14f2; border:2px solid var(--acc); padding:8px 14px; display:none; z-index:6; max-width:90vw; }
  .up{color:#3fcf6d}.down{color:#ef5350}
</style>
</head>
<body>
<div id="wrap">
  <div id="bar">
    <b>PHỐ TÀI CHÍNH</b><span style="color:var(--mut)">demo · hướng 1+2+3</span>
    <label>Giờ <select id="selHour"><option value="real">Thật</option><option value="morning">Sáng</option><option value="day">Trưa</option><option value="dusk">Chiều tà</option><option value="night">Đêm</option></select></label>
    <label>Thị trường <select id="selMood"><option value="real">Thật (VN30)</option><option value="up">Xanh</option><option value="down">Đỏ</option><option value="ceil">Tím trần</option><option value="floor">Nằm sàn</option></select></label>
    <button id="btnBuild">+ Xây thêm lô</button>
    <button id="btnEnter" class="p">Vào sàn giao dịch</button>
    <span id="vn" style="margin-left:auto"></span>
  </div>
  <div id="stage"><canvas id="c" width="480" height="270"></canvas></div>
  <div id="hint">Rê chuột vào tòa nhà trong skyline để xem mã. Bấm vào tòa CTCK để vào sàn, bấm lô đất để xem điều kiện xây.</div>
</div>
<div id="tip"></div><div id="toast"></div>
<script>
'use strict';
const W = 480, H = 270, HORIZON = 150, API = 'https://stock20s.stock20s-worker.workers.dev';
const cv = document.getElementById('c'), ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const hash = (s) => { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const rnd = (() => { let a = 12345; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; })();
const hex2 = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => { const A = hex2(a), B = hex2(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * t)).join(',')})`; };
const shade = (h, k) => { const A = hex2(h); return `rgb(${A.map((v) => clamp(Math.round(v * k), 0, 255)).join(',')})`; };

/* ---------- dữ liệu ---------- */
const FALLBACK = ['ACB','BID','BSR','CTG','FPT','GAS','GVR','HDB','HPG','LPB','MBB','MCH','MSN','MWG','SAB','SHB','SSB','SSI','STB','TCB','TCX','VCB','VHM','VIB','VIC','VJC','VNM','VPB','VPL','VRE'];
const S = { scene: 'city', fade: 0, next: null, board: null, vnPct: null, hour: 'real', mood: 'real', extra: 0, t: 0, mouse: null, conf: [], rain: [], lights: [], people: [], bikes: [], noise: {} };
FALLBACK.forEach((s) => { S.noise[s] = 0; });
function company() { try { return JSON.parse(localStorage.getItem('s20.company.v1')) || null; } catch { return null; } }
async function load() {
  try {
    const m = await (await fetch(API + '/api/market')).json();
    if (m.board) S.board = m.board;
    const sl = await (await fetch(API + '/api/slots')).json();
    const v = sl.slots.VNINDEX; if (v?.length) S.vnPct = (v[v.length - 1].c / v[0].o - 1) * 100;
  } catch { /* dùng dữ liệu giả */ }
}
function tickers() {
  const base = S.board ?? FALLBACK.map((s) => ({ sym: s, ref: 20, ceil: 21.4, floor: 18.6, last: 20 * (1 + ((hash(s) % 100) - 50) / 1600) }));
  return base.map((b, i) => {
    let pct = (b.last / b.ref - 1) * 100 + (S.noise[b.sym] || 0);
    if (S.mood === 'up') pct = 1 + (hash(b.sym) % 40) / 10;
    else if (S.mood === 'down') pct = -1 - (hash(b.sym) % 50) / 10;
    else if (S.mood === 'ceil') pct = hash(b.sym) % 3 === 0 ? 6.9 : 1 + (hash(b.sym) % 30) / 10;
    else if (S.mood === 'floor') pct = hash(b.sym) % 3 === 0 ? -6.9 : -1 - (hash(b.sym) % 30) / 10;
    const lim = b.ref ? ((b.ceil / b.ref - 1) * 100 || 7) : 7;
    const st = pct >= lim - 0.15 ? 'ceil' : pct <= -lim + 0.15 ? 'floor' : Math.abs(pct) < 0.05 ? 'ref' : pct > 0 ? 'up' : 'down';
    return { sym: b.sym, pct, st, price: b.ref * (1 + pct / 100), i };
  });
}
function moodVal() {
  if (S.mood === 'up' || S.mood === 'ceil') return 1; if (S.mood === 'down' || S.mood === 'floor') return -1;
  return clamp((S.vnPct ?? 0) / 1, -1, 1);
}
const COL = { up: '#3fcf6d', down: '#ef5350', ref: '#f5c542', ceil: '#d946ef', floor: '#22d3ee' };

/* ---------- thời gian & bầu trời ---------- */
function hourNow() {
  if (S.hour === 'morning') return 7.5; if (S.hour === 'day') return 12; if (S.hour === 'dusk') return 17.8; if (S.hour === 'night') return 22;
  const d = new Date(); return d.getHours() + d.getMinutes() / 60;
}
const SKY = [[0, '#070a22', '#14194a'], [5, '#0d1236', '#2a2a66'], [6.3, '#4a3a7a', '#f2a65a'], [8, '#4f9fe0', '#cfeaff'], [14, '#4a96dc', '#bfe3ff'], [17, '#5a6fc0', '#ffb070'], [18.4, '#2b2a6e', '#ff7a5b'], [19.5, '#0e1238', '#2b2760'], [24, '#070a22', '#14194a']];
function skyAt(h) {
  for (let i = 0; i < SKY.length - 1; i++) if (h >= SKY[i][0] && h <= SKY[i + 1][0]) {
    const t = (h - SKY[i][0]) / (SKY[i + 1][0] - SKY[i][0]); return [mix(SKY[i][1], SKY[i + 1][1], t), mix(SKY[i][2], SKY[i + 1][2], t)];
  } return [SKY[0][1], SKY[0][2]];
}
const nightness = (h) => h < 5.5 || h > 19.5 ? 1 : h < 7 ? 1 - (h - 5.5) / 1.5 : h > 18 ? (h - 18) / 1.5 : 0;

function drawSky(h, mood) {
  const [top, bot] = skyAt(h); const g = ctx.createLinearGradient(0, 0, 0, HORIZON);
  const grey = mood < 0 ? -mood * 0.55 : 0;
  g.addColorStop(0, grey ? mix(rgbHex(top), '#4a4a58', grey) : top); g.addColorStop(1, grey ? mix(rgbHex(bot), '#6a6a78', grey) : bot);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, HORIZON);
  const n = nightness(h);
  if (n > 0.3) { ctx.fillStyle = `rgba(255,255,255,${n * 0.9})`; for (let i = 0; i < 50; i++) { const x = (i * 97) % W, y = (i * 53) % 90; if ((i + Math.floor(S.t * 2)) % 7) ctx.fillRect(x, y, 1, 1); } }
  const sunT = (h - 6) / 12; if (sunT > 0 && sunT < 1) { const x = 40 + sunT * 400, y = 110 - Math.sin(sunT * Math.PI) * 80; ctx.fillStyle = grey > 0.3 ? '#bdb9a0' : '#ffe27a'; disc(x, y, 9); }
  else { const mt = ((h + 6) % 24) / 12; const x = 40 + clamp(mt, 0, 1) * 400, y = 100 - Math.sin(clamp(mt, 0, 1) * Math.PI) * 60; ctx.fillStyle = '#e8ecff'; disc(x, y, 6); ctx.fillStyle = skyAt(h)[0]; disc(x + 3, y - 2, 5); }
  ctx.fillStyle = mood < -0.2 ? 'rgba(70,70,86,.9)' : 'rgba(255,255,255,.75)';
  for (let i = 0; i < 4; i++) { const x = ((S.t * (3 + i) + i * 140) % (W + 80)) - 40, y = 20 + i * 14; ctx.fillRect(x, y, 34, 6); ctx.fillRect(x + 6, y - 4, 22, 5); }
}
const rgbHex = (c) => { const m = c.match(/\d+/g).map(Number); return '#' + m.map((v) => v.toString(16).padStart(2, '0')).join(''); };
function disc(x, y, r) { for (let j = -r; j <= r; j++) { const w = Math.floor(Math.sqrt(r * r - j * j)); ctx.fillRect(Math.round(x - w), Math.round(y + j), w * 2 + 1, 1); } }

/* ---------- skyline VN30 ---------- */
const SECT = ['#5b6b9a', '#6a5b8a', '#4f7a8a', '#7a6a5b', '#5b8a6a', '#8a5b6a'];
function drawSkyline(tk, h) {
  const n = nightness(h); S.hov = null;
  tk.forEach((t, i) => {
    const x = 6 + i * 15.5, w = 13, baseH = 36 + (hash(t.sym) % 26);
    const hh = clamp(baseH * (1 + t.pct * 0.06), 16, 112), y = HORIZON - hh;
    const body = SECT[hash(t.sym) % SECT.length];
    ctx.fillStyle = shade(body, t.st === 'floor' ? 0.55 : 1); ctx.fillRect(x, y, w, hh);
    ctx.fillStyle = shade(body, 0.72); ctx.fillRect(x + w - 3, y, 3, hh);
    ctx.fillStyle = shade(body, 1.2); ctx.fillRect(x, y, w, 2);
    for (let r = 0; r < Math.floor(hh / 5); r++) for (let c = 0; c < 3; c++) {
      const on = (hash(t.sym + r + c) % 5) > 0 && (t.st !== 'floor' || (r + c) % 3 === 0);
      if (on) S.lights.push([x + 2 + c * 3, y + 4 + r * 5, 2, 2, t.st === 'down' || t.st === 'floor' ? '#ff6f61' : t.st === 'ceil' ? '#f0a0ff' : '#ffe9a0', n > 0.3 ? 1 : 0.35]);
    }
    if (t.st === 'ceil') { ctx.fillStyle = COL.ceil; ctx.fillRect(x, y - 1, w, 1); ctx.fillRect(x - 1, y, 1, hh); ctx.fillRect(x + w, y, 1, hh); if (rnd() < 0.04) emit(x + w / 2, y, COL.ceil, 6); }
    if (t.st === 'floor') { ctx.fillStyle = COL.floor; ctx.fillRect(x, y - 1, w, 1); ctx.fillStyle = '#0a0a12'; ctx.fillRect(x + 4, y + 6, 1, 8); ctx.fillRect(x + 5, y + 14, 1, 6); }
    if (S.mouse && S.mouse.x >= x && S.mouse.x <= x + w && S.mouse.y >= y && S.mouse.y <= HORIZON) S.hov = { t, x, y: y };
  });
  ctx.fillStyle = '#12101f'; ctx.fillRect(0, HORIZON - 2, W, 4);
}

/* ---------- isometric ---------- */
const OX = 240, OY = 92;
const P = (x, y, z = 0) => [OX + (x - y) * 16, OY + (x + y) * 8 - z];
function quad(a, b, c, d, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(d[0], d[1]); ctx.closePath(); ctx.fill(); }
function tile(x, y, col) { quad(P(x, y), P(x + 1, y), P(x + 1, y + 1), P(x, y + 1), col); }
function isoBox(x, y, w, d, z0, z1, top, left, right) {
  quad(P(x + w, y, z0), P(x + w, y + d, z0), P(x + w, y + d, z1), P(x + w, y, z1), right);
  quad(P(x, y + d, z0), P(x + w, y + d, z0), P(x + w, y + d, z1), P(x, y + d, z1), left);
  quad(P(x, y, z1), P(x + w, y, z1), P(x + w, y + d, z1), P(x, y + d, z1), top);
}
function windows(face, x, y, w, d, z0, z1, cols, rows, col, a) {
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const u0 = (c + 0.22) / cols, u1 = (c + 0.78) / cols, v0 = z0 + (r + 0.25) / rows * (z1 - z0), v1 = z0 + (r + 0.7) / rows * (z1 - z0);
    const pt = (u, v) => face === 'L' ? P(x + u * w, y + d, v) : P(x + w, y + u * d, v);
    const q = [pt(u0, v0), pt(u1, v0), pt(u1, v1), pt(u0, v1)];
    if ((hash(face + x + y + z0 + c + r) % 6) > 0) S.lights.push(['q', q, col, a]);
  }
}
function ground() {
  for (let s = 0; s <= 20; s++) for (let gx = 0; gx <= 10; gx++) { const gy = s - gx; if (gy < 0 || gy > 10) continue;
    const road = gx === 5 || gy === 5, walk = !road && (gx === 4 || gx === 6 || gy === 4 || gy === 6);
    tile(gx, gy, road ? '#3d3d4a' : walk ? '#a9a6b8' : ((gx + gy) % 2 ? '#7f9a76' : '#789270'));
    if (road && (gx + gy) % 2 === 0 && !(gx === 5 && gy === 5)) { const [cx, cy] = P(gx + 0.5, gy + 0.5); ctx.fillStyle = '#d8d3a0'; ctx.fillRect(cx - 2, cy - 1, 4, 1); }
  }
}
function tree(gx, gy) { const [x, y] = P(gx + 0.5, gy + 0.5); ctx.fillStyle = '#5a3a1c'; ctx.fillRect(x - 1, y - 8, 2, 8); ctx.fillStyle = '#2f8f3a'; disc(x, y - 12, 5); ctx.fillStyle = '#48b64f'; disc(x - 1, y - 14, 3); }
function lamp(gx, gy, n) { const [x, y] = P(gx + 0.5, gy + 0.5); ctx.fillStyle = '#2a2a36'; ctx.fillRect(x, y - 14, 1, 14); S.lights.push([x - 1, y - 16, 3, 2, '#ffe9a0', n > 0.2 ? 1 : 0]); }

function hq(n, floors, tk) {
  const x = 7, y = 7, w = 3, d = 3, FH = 15;
  const night = n;
  for (let k = 0; k < floors; k++) {
    const z0 = k * FH, z1 = z0 + FH;
    isoBox(x, y, w, d, z0, z1, '#9fc0ea', '#5a7bb0', '#44628f');
    ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.beginPath(); const a = P(x, y + d, z1), b = P(x + w, y + d, z1), c = P(x + w, y, z1); ctx.moveTo(a[0], a[1] + 0.5); ctx.lineTo(b[0], b[1] + 0.5); ctx.lineTo(c[0], c[1] + 0.5); ctx.stroke();
    windows('L', x, y, w, d, z0 + 2, z1 - 1, 4, 1, '#ffe9a0', night > 0.3 ? 1 : 0.5);
    windows('R', x, y, w, d, z0 + 2, z1 - 1, 4, 1, '#ffd27a', night > 0.3 ? 0.9 : 0.4);
  }
  const zt = floors * FH;
  isoBox(x - 0.1, y - 0.1, w + 0.2, d + 0.2, zt, zt + 3, '#cfd6e6', '#8f98b0', '#6f7894');
  if (floors < 5) {                                           // giàn giáo tầng kế tiếp + cần cẩu
    ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 1; const pts = [[x, y + d], [x + w, y + d], [x + w, y]];
    pts.forEach((p) => { const a = P(p[0], p[1], zt + 3), b = P(p[0], p[1], zt + 3 + FH); ctx.beginPath(); ctx.moveTo(a[0] + 0.5, a[1]); ctx.lineTo(b[0] + 0.5, b[1]); ctx.stroke(); });
    const t1 = P(x, y + d, zt + 3 + FH), t2 = P(x + w, y + d, zt + 3 + FH), t3 = P(x + w, y, zt + 3 + FH);
    ctx.beginPath(); ctx.moveTo(t1[0], t1[1]); ctx.lineTo(t2[0], t2[1]); ctx.lineTo(t3[0], t3[1]); ctx.stroke();
    const cb = P(x + w, y + d, zt + 3); ctx.fillStyle = '#e0a020'; const sw = Math.sin(S.t) * 6; ctx.fillRect(cb[0] + 6, cb[1] - 34, 1, 34); ctx.fillRect(cb[0] - 12 + sw, cb[1] - 34, 28, 2); ctx.fillRect(cb[0] - 11 + sw, cb[1] - 32, 1, 8);
  }
  const top = P(x + w / 2, y + d / 2, zt + 3); ctx.fillStyle = '#888899'; ctx.fillRect(top[0], top[1] - 14, 1, 14); ctx.fillStyle = '#ef4444'; ctx.fillRect(top[0] - 1, top[1] - 16, 3, 3);
  // cửa chính + biển hiệu
  const dp = [P(x + 1, y + d, 0), P(x + 2, y + d, 0), P(x + 2, y + d, 9), P(x + 1, y + d, 9)]; quad(dp[0], dp[1], dp[2], dp[3], '#3a2a1c'); S.lights.push(['q', [P(x + 1.1, y + d, 1), P(x + 1.9, y + d, 1), P(x + 1.9, y + d, 8), P(x + 1.1, y + d, 8)], '#ffd27a', 0.8]);
  const sg = P(x + w / 2, y + d, 12); S.signs.push([sg[0] - 20, sg[1] - 5, 40, 10, 'SÀN ĐỎ', '#f5c542']);
  S.hqBox = { x: P(x, y + d, 0)[0] - 4, y: P(x, y, zt)[1] - 30, w: 56, h: 100 };
}
function lot(name, gx, gy, built, h, colors, cost, sign) {
  if (built) {
    isoBox(gx, gy, 3, 3, 0, h, colors[0], colors[1], colors[2]);
    windows('L', gx, gy, 3, 3, 3, h - 2, 4, Math.floor(h / 10), '#ffe9a0', 0.8); windows('R', gx, gy, 3, 3, 3, h - 2, 4, Math.floor(h / 10), '#ffd27a', 0.7);
    const sg = P(gx + 1.5, gy + 3, h * 0.45); S.signs.push([sg[0] - 26, sg[1] - 5, 52, 10, name, sign]);
  } else {
    ctx.strokeStyle = '#d8a860'; for (let i = 0; i <= 3; i++) { const a = P(gx + i, gy + 3, 0), b = P(gx + i, gy + 3, 5); ctx.beginPath(); ctx.moveTo(a[0] + 0.5, a[1]); ctx.lineTo(b[0] + 0.5, b[1]); ctx.stroke(); const c = P(gx + 3, gy + i, 0), e = P(gx + 3, gy + i, 5); ctx.beginPath(); ctx.moveTo(c[0] + 0.5, c[1]); ctx.lineTo(e[0] + 0.5, e[1]); ctx.stroke(); }
    const sg = P(gx + 1.5, gy + 1.5, 0); ctx.fillStyle = '#0b0a14'; ctx.fillRect(sg[0] - 30, sg[1] - 38, 60, 32); ctx.strokeStyle = sign; ctx.strokeRect(sg[0] - 30.5, sg[1] - 38.5, 61, 33);
    ctx.fillStyle = '#5a3a1c'; ctx.fillRect(sg[0] - 1, sg[1] - 6, 2, 6);
    ctx.font = '9px VT323'; ctx.fillStyle = '#d8d4ee'; ctx.fillText('MẶT BẰNG', sg[0] - 26, sg[1] - 28); ctx.fillStyle = sign; ctx.fillText(name, sg[0] - 26, sg[1] - 18); ctx.fillStyle = '#f5c542'; ctx.fillText(cost, sg[0] - 26, sg[1] - 9);
  }
}
function walkers(n) {
  S.people.forEach((p) => {
    p.t += 0.008 * p.sp; const f = p.t % 1; const [x, y] = p.axis === 'x' ? P(p.fixed + 0.5, f * 11, 0) : P(f * 11, p.fixed + 0.5, 0);
    const px = Math.round(x), py = Math.round(y); const b = Math.floor(S.t * 6 + p.o) % 2;
    ctx.fillStyle = '#1e1e1e'; ctx.fillRect(px - 2, py - 3 + b, 1, 3); ctx.fillRect(px + 1, py - 3 + (1 - b), 1, 3);
    ctx.fillStyle = p.c; ctx.fillRect(px - 2, py - 8, 5, 5); ctx.fillStyle = '#e0ac82'; ctx.fillRect(px - 1, py - 11, 3, 3); ctx.fillStyle = '#2b1d12'; ctx.fillRect(px - 1, py - 12, 3, 1);
  });
  S.bikes.forEach((b) => {
    b.t += 0.006 * b.sp; const f = b.t % 1, dir = b.dir; const [x, y] = b.axis === 'x' ? P(b.fixed + 0.5, dir > 0 ? f * 11 : 11 - f * 11, 0) : P(dir > 0 ? f * 11 : 11 - f * 11, b.fixed + 0.5, 0);
    const px = Math.round(x), py = Math.round(y);
    ctx.fillStyle = '#111'; ctx.fillRect(px - 4, py - 2, 3, 3); ctx.fillRect(px + 2, py - 2, 3, 3); ctx.fillStyle = b.c; ctx.fillRect(px - 3, py - 5, 8, 3);
    ctx.fillStyle = '#e0ac82'; ctx.fillRect(px, py - 9, 2, 2); ctx.fillStyle = '#d94f4f'; ctx.fillRect(px - 1, py - 8, 4, 3);
    S.lights.push([px + 5, py - 4, 2, 1, '#fff6c0', n > 0.2 ? 1 : 0]);
  });
}
for (let i = 0; i < 7; i++) S.people.push({ axis: i % 2 ? 'x' : 'y', fixed: [4, 6][i % 2 === 0 ? 0 : 1] + (i > 3 ? 0 : 0), t: rnd(), sp: 0.6 + rnd() * 0.8, o: rnd() * 5, c: ['#d94f4f', '#4f8fd9', '#4fb36a', '#a460d9', '#e0c04f', '#e8e8e8', '#3fb8b8'][i] });
for (let i = 0; i < 4; i++) S.bikes.push({ axis: i % 2 ? 'x' : 'y', fixed: 5, dir: i < 2 ? 1 : -1, t: rnd(), sp: 1 + rnd(), c: ['#c0392b', '#2e86c1', '#27ae60', '#8e44ad'][i] });

function city(tk, h, mood) {
  const n = nightness(h), co = company(); const floors = clamp(co?.floors?.length ?? 1, 1, 5);
  const rooms = new Set(co?.rooms ?? []); const ex = S.extra;
  S.lights = []; S.signs = [];
  drawSky(h, mood); drawSkyline(tk, h); ctx.fillStyle = '#4a5a48'; ctx.fillRect(0, HORIZON + 2, W, H - HORIZON); ground();
  [[1, 1], [1, 7], [7, 1]].forEach(() => {});
  const objs = [];
  objs.push([1 + 1 + 1.5, () => lot('TIỆM VÀNG', 1, 1, rooms.has('vg') || ex >= 1, 30, ['#f0d27a', '#c9a227', '#9c7a12'], '3.000 tr', '#f5c542')]);
  objs.push([7 + 1 + 1.5, () => lot('BẤT ĐỘNG SẢN', 7, 1, rooms.has('bd') || ex >= 2, 44, ['#a8d8b0', '#4fb36a', '#2f8f4a'], '8.000 tr', '#3fcf6d')]);
  objs.push([1 + 7 + 1.5, () => lot('BẢO HIỂM', 1, 7, rooms.has('bh') || ex >= 3, 36, ['#f4b0cf', '#e0609a', '#b04070'], '4.000 tr', '#ec4899')]);
  objs.push([7 + 7 + 3, () => hq(n, floors, tk)]);
  [[4, 2], [6, 3], [4, 8], [6, 9], [2, 5.0], [3, 4], [9, 6], [8, 4], [10, 4], [4, 10]].forEach(([a, b]) => objs.push([a + b + 1, () => (a + b) % 2 ? tree(a, b) : lamp(a, b, n)]));
  objs.sort((a, b) => a[0] - b[0]).forEach((o) => o[1]());
  walkers(n);
  // phủ đêm/chiều + mưa rồi vẽ đèn sáng
  const dark = n * 0.5 + (mood < 0 ? -mood * 0.18 : 0);
  if (dark > 0) { ctx.fillStyle = `rgba(8,10,44,${dark})`; ctx.fillRect(0, 0, W, H); }
  if (h > 16.5 && h < 19) { ctx.fillStyle = 'rgba(255,120,70,.12)'; ctx.fillRect(0, 0, W, H); }
  S.lights.forEach((l) => { if (l[0] === 'q') { ctx.globalAlpha = l[3]; quad(l[1][0], l[1][1], l[1][2], l[1][3], l[2]); ctx.globalAlpha = 1; } else { ctx.globalAlpha = l[5]; ctx.fillStyle = l[4]; ctx.fillRect(l[0], l[1], l[2], l[3]); ctx.globalAlpha = 1; } });
  S.signs.forEach((g) => { ctx.fillStyle = '#0b0a14'; ctx.fillRect(g[0], g[1], g[2], g[3]); ctx.strokeStyle = g[5]; ctx.strokeRect(g[0] + 0.5, g[1] + 0.5, g[2] - 1, g[3] - 1); ctx.fillStyle = g[5]; ctx.font = '9px VT323'; ctx.fillText(g[4], g[0] + 3, g[1] + 8); });
  if (mood < -0.3) rain(mood);
}
function rain(m) {
  while (S.rain.length < 120 * -m) S.rain.push({ x: rnd() * W, y: rnd() * H, v: 3 + rnd() * 3 });
  ctx.strokeStyle = 'rgba(170,200,255,.55)'; S.rain.forEach((r) => { ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - 1, r.y + 4); ctx.stroke(); r.y += r.v; r.x -= 0.6; if (r.y > H) { r.y = -4; r.x = rnd() * W; } });
}
function emit(x, y, col, n) { for (let i = 0; i < n; i++) S.conf.push({ x, y, vx: (rnd() - 0.5) * 1.6, vy: -rnd() * 1.6 - 0.4, c: i % 2 ? col : '#f5c542', l: 60 + rnd() * 40 }); }
function confetti() { S.conf = S.conf.filter((p) => p.l > 0); S.conf.forEach((p) => { ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2); p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.l--; }); }

/* ---------- sàn giao dịch (trong nhà) ---------- */
function charBack(x, y, shirt, hair) { ctx.fillStyle = hair; ctx.fillRect(x + 1, y, 6, 5); ctx.fillStyle = shirt; ctx.fillRect(x, y + 5, 8, 6); ctx.fillStyle = '#e0ac82'; ctx.fillRect(x - 1, y + 6, 1, 4); ctx.fillRect(x + 8, y + 6, 1, 4); }
function hall(tk, mood) {
  const ceilN = tk.filter((t) => t.st === 'ceil').length, floorN = tk.filter((t) => t.st === 'floor').length;
  // sàn + tường
  ctx.fillStyle = '#2a2540'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#1b1830'; ctx.fillRect(0, 0, W, 128);
  for (let y = 128; y < H; y += 12) for (let x = ((y / 12) % 2) * 12 - 12; x < W; x += 24) { ctx.fillStyle = (x / 12 + y / 12) % 2 ? '#3a3358' : '#332d4e'; ctx.fillRect(x, y, 12, 12); }
  // bảng điện khổng lồ
  const bx = 14, by = 10, bw = 452, bh = 108; ctx.fillStyle = '#05040a'; ctx.fillRect(bx - 4, by - 4, bw + 8, bh + 8); ctx.fillStyle = '#4b4373'; ctx.fillRect(bx - 4, by - 4, bw + 8, 2);
  const cols = 5, rows = 6, cw = bw / cols, rh = bh / rows;
  ctx.font = '10px VT323';
  tk.slice(0, cols * rows).forEach((t, i) => {
    const c = i % cols, r = Math.floor(i / cols), x = bx + c * cw, y = by + r * rh; const col = COL[t.st];
    const flash = t.st === 'ceil' || t.st === 'floor' ? (Math.floor(S.t * 3 + i) % 2 ? 0.28 : 0.12) : 0.06;
    ctx.fillStyle = col; ctx.globalAlpha = flash; ctx.fillRect(x + 1, y + 1, cw - 2, rh - 2); ctx.globalAlpha = 1;
    ctx.fillStyle = col; ctx.fillText(t.sym, x + 5, y + 13); ctx.fillText(t.price.toFixed(1), x + 32, y + 13); ctx.fillText((t.pct >= 0 ? '+' : '') + t.pct.toFixed(1) + '%', x + 58, y + 13);
  });
  // ánh sáng toàn phòng theo thị trường
  if (floorN > 4 || mood < -0.5) { ctx.fillStyle = `rgba(20,60,110,${0.22 + 0.1 * Math.sin(S.t * 4)})`; ctx.fillRect(0, 0, W, H); }
  if (ceilN > 3) { ctx.fillStyle = `rgba(217,70,239,${0.08 + 0.05 * Math.sin(S.t * 5)})`; ctx.fillRect(0, 0, W, H); if (rnd() < 0.25) emit(bx + rnd() * bw, by + bh, '#d946ef', 4); }
  // bàn môi giới
  for (let r = 0; r < 2; r++) for (let c = 0; c < 5; c++) {
    const x = 36 + c * 86 + (r ? 24 : 0), y = 150 + r * 54;
    ctx.fillStyle = '#8c5a2b'; ctx.fillRect(x - 6, y + 12, 36, 12); ctx.fillStyle = '#c98a4b'; ctx.fillRect(x - 6, y + 8, 36, 5);
    ctx.fillStyle = '#1b1b24'; ctx.fillRect(x + 4, y - 2, 14, 11); const tkc = tk[(r * 5 + c) % tk.length]; ctx.fillStyle = COL[tkc.st]; ctx.globalAlpha = 0.85; ctx.fillRect(x + 5, y - 1, 12, 8); ctx.globalAlpha = 1;
    ctx.fillStyle = '#2f8f8f'; ctx.fillRect(x + 2, y + 22, 18, 5);
    const bob = Math.floor(S.t * 2 + c + r) % 2; charBack(x + 6, y + 14 + bob, ['#d94f4f', '#4f8fd9', '#4fb36a', '#a460d9', '#e0c04f'][c], ['#2b1d12', '#5a3a1c', '#1a1a1a', '#b5651d', '#7a7a7a'][(c + r) % 5]);
  }
  // chỉ số nhỏ
  ctx.fillStyle = '#0b0a14'; ctx.fillRect(176, 124, 128, 14); ctx.fillStyle = '#f5c542'; ctx.font = '10px VT323';
  ctx.fillText(`TÍM TRẦN ${ceilN}   NẰM SÀN ${floorN}`, 184, 134);
}

/* ---------- vòng lặp ---------- */
function frame() {
  S.t += 1 / 60; ctx.clearRect(0, 0, W, H);
  Object.keys(S.noise).forEach((k) => { if (rnd() < 0.01) S.noise[k] = clamp((S.noise[k] || 0) + (rnd() - 0.5) * 0.25, -0.6, 0.6); });
  const tk = tickers(), mood = moodVal(), h = hourNow();
  if (S.scene === 'city') city(tk, h, mood); else hall(tk, mood);
  confetti();
  if (S.fade > 0) { ctx.fillStyle = `rgba(0,0,0,${S.fade})`; ctx.fillRect(0, 0, W, H); S.fade -= 0.06; if (S.fade <= 0 && S.next) { S.next = null; } }
  const v = S.mood === 'real' ? S.vnPct : null;
  $('#vn').innerHTML = S.vnPct == null ? '' : `VN-Index <b class="${S.vnPct >= 0 ? 'up' : 'down'}" style="font-weight:400">${S.vnPct >= 0 ? '+' : ''}${S.vnPct.toFixed(2)}%</b> · ${hourNow().toFixed(1)}h`;
  // tooltip
  const tip = $('#tip');
  if (S.scene === 'city' && S.hov && S.mouse) { tip.style.display = 'block'; tip.style.left = S.mouse.cx + 14 + 'px'; tip.style.top = S.mouse.cy + 14 + 'px'; tip.innerHTML = `<b>${S.hov.t.sym}</b> <span style="color:${COL[S.hov.t.st]}">${S.hov.t.pct >= 0 ? '+' : ''}${S.hov.t.pct.toFixed(2)}% · ${S.hov.t.st === 'ceil' ? 'TRẦN' : S.hov.t.st === 'floor' ? 'SÀN' : ''}</span>`; } else tip.style.display = 'none';
  requestAnimationFrame(frame);
}
function go(scene) { S.fade = 1; setTimeout(() => { S.scene = scene; $('#btnEnter').textContent = scene === 'city' ? 'Vào sàn giao dịch' : '← Ra phố'; $('#hint').textContent = scene === 'city' ? 'Rê chuột vào tòa nhà trong skyline để xem mã. Bấm vào tòa CTCK để vào sàn, bấm lô đất để xem điều kiện xây.' : 'Bảng điện sống: mã tím trần phát sáng tím và bắn pháo giấy, nằm sàn thì cả phòng tối lơ. Chọn “Tím trần” / “Nằm sàn” ở trên để xem phản ứng.'; }, 180); }
function toast(t) { const e = $('#toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => { e.style.display = 'none'; }, 3200); }

cv.addEventListener('mousemove', (e) => { const r = cv.getBoundingClientRect(); S.mouse = { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H, cx: e.clientX, cy: e.clientY }; });
cv.addEventListener('mouseleave', () => { S.mouse = null; });
cv.addEventListener('click', () => {
  if (!S.mouse) return;
  if (S.scene === 'city') {
    const b = S.hqBox, m = S.mouse;
    if (b && m.x >= b.x && m.x <= b.x + b.w && m.y >= b.y && m.y <= b.y + b.h) { go('hall'); return; }
    const lots = [['Tiệm vàng', 1, 1, 'vg'], ['Bất động sản', 7, 1, 'bd'], ['Bảo hiểm', 1, 7, 'bh']];
    for (const [n, gx, gy] of lots) { const c = P(gx + 1.5, gy + 1.5, 0); if (Math.abs(m.x - c[0]) < 40 && m.y > c[1] - 40 && m.y < c[1] + 14) { toast(`Lô “${n}”: cần mở tầng liên quan, đủ quy mô và tiền để xây (xem tòa CTCK → Mô hình đầu tư).`); return; } }
  }
});
$('#selHour').onchange = (e) => { S.hour = e.target.value; };
$('#selMood').onchange = (e) => { S.mood = e.target.value; };
$('#btnBuild').onclick = () => { S.extra = (S.extra + 1) % 4; toast(S.extra ? `Demo: đã xây ${S.extra}/3 lô` : 'Demo: về lại ba lô trống'); };
$('#btnEnter').onclick = () => go(S.scene === 'city' ? 'hall' : 'city');
(async () => { try { await Promise.race([document.fonts.load('10px VT323'), new Promise((r) => setTimeout(r, 1200))]); } catch {} load(); requestAnimationFrame(frame); })();
</script>
</body>
