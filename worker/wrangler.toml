name = "stock20s"
main = "src/index.ts"
compatibility_date = "2025-10-01"

# Cron theo UTC. VN = UTC+7: 09:00–15:40 giờ VN, thứ 2–6, mỗi 20 phút.
[triggers]
crons = ["*/20 2-8 * * 1-5"]

[vars]
ALLOWED_ORIGINS = "https://khoitran3172.github.io,http://127.0.0.1:8765,http://localhost:5173"

# database_id điền sau khi chạy: npx wrangler d1 create stock20s
[[d1_databases]]
binding = "DB"
database_name = "stock20s"
database_id = "0286d1f7-0e14-498b-89e9-eb8b5a8b0413"
